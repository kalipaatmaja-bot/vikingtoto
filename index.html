*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{

  font-family:'Poppins',sans-serif;

  min-height:100vh;

  display:flex;
  justify-content:center;
  align-items:center;

  overflow:hidden;

  background:#000;

}

/* SNOW EFFECT */

.snow{

  position:fixed;

  inset:0;

  pointer-events:none;

  overflow:hidden;

}

.snow::before,
.snow::after{

  content:'';

  position:absolute;

  inset:-200% 0 0 0;

  background-image:
    radial-gradient(white 1px, transparent 1px);

  background-size:35px 35px;

  opacity:.18;

  animation:snowFall 18s linear infinite;

}

.snow::after{

  background-size:55px 55px;

  opacity:.10;

  animation-duration:28s;

}

@keyframes snowFall{

  from{
    transform:translateY(0);
  }

  to{
    transform:translateY(50%);
  }

}

@keyframes snowFall{

  from{
    transform:translateY(-100px);
  }

  to{
    transform:translateY(100vh);
  }

}

/* WRAPPER */

.wrapper{

  width:100%;

  display:flex;

  justify-content:center;

  padding:20px;

}

/* MAIN BOX */

.main-box{

  width:540px;

  background:rgba(0,0,0,0.82);

  border-radius:32px;

  padding:38px;

  border:1px solid rgba(0,255,80,0.18);

  backdrop-filter:blur(12px);

  box-shadow:
  0 0 25px rgba(0,255,80,0.18),
  0 0 80px rgba(0,255,80,0.10),
  0 0 120px rgba(0,255,80,0.08);

  animation:floatBox 4s ease-in-out infinite;

}

/* FLOAT */

@keyframes floatBox{

  0%{
    transform:translateY(0px);
  }

  50%{
    transform:translateY(-6px);
  }

  100%{
    transform:translateY(0px);
  }

}

/* LOGO */

.logo{

  text-align:center;

  margin-bottom:4px;

  margin-top:-4px;

  font-family:'Orbitron',sans-serif;

  font-size:30px;

  font-weight:900;

  letter-spacing:1px;

  line-height:1;

  color:#00ff66;

  text-shadow:
  0 0 5px #00ff66,
  0 0 15px #00ff66,
  0 0 35px rgba(0,255,100,0.8);

}

.logo span{

  opacity:0;

  display:inline-block;

  transform:translateY(25px);

  animation:pop .45s forwards;

}

/* LOGO DELAY */

.logo span:nth-child(1){animation-delay:.1s;}
.logo span:nth-child(2){animation-delay:.2s;}
.logo span:nth-child(3){animation-delay:.3s;}
.logo span:nth-child(4){animation-delay:.4s;}
.logo span:nth-child(5){animation-delay:.5s;}
.logo span:nth-child(6){animation-delay:.6s;}
.logo span:nth-child(7){animation-delay:.7s;}
.logo span:nth-child(8){animation-delay:.8s;}
.logo span:nth-child(9){animation-delay:.9s;}
.logo span:nth-child(10){animation-delay:1s;}

/* DESC */

.desc{

  text-align:center;

  color:#dcdcdc;

  font-size:11px;

  letter-spacing:3px;

  margin-bottom:18px;

}

/* CARD */

.card{

  overflow:hidden;

  border-radius:26px;

  margin-bottom:22px;

  position:relative;

  box-shadow:
  0 0 20px rgba(0,255,80,0.15);

}

/* SHINE */

.card::before{

  content:'';

  position:absolute;

  top:-100%;

  left:-40%;

  width:60%;

  height:300%;

  background:rgba(255,255,255,0.08);

  transform:rotate(25deg);

  animation:shine 4s linear infinite;

}

@keyframes shine{

  0%{
    left:-60%;
  }

  100%{
    left:130%;
  }

}

/* IMAGE */

.banner{

  width:100%;

  height:500px;

  object-fit:cover;

  display:block;

  transition:.5s;

}

.banner:hover{

  transform:scale(1.03);

}

/* BUTTON */

.btn{

  display:block;

  width:100%;

  padding:16px;

  margin:14px 0;

  border-radius:40px;

  font-size:18px;

  font-weight:700;

  letter-spacing:1px;

  text-align:center;

  text-decoration:none;

  transition:.3s;

}

/* LOGIN */

.login{

  color:#000;

  background:linear-gradient(
    45deg,
    #00ff66,
    #00b34d
  );

  box-shadow:
  0 0 20px rgba(0,255,100,0.45),
  0 0 40px rgba(0,255,100,0.18);

}

/* DAFTAR */

.daftar{

  color:#fff;

  background:linear-gradient(
    45deg,
    #ff2a2a,
    #8b0000
  );

  box-shadow:
  0 0 20px rgba(255,0,0,0.35),
  0 0 40px rgba(255,0,0,0.12);

}

/* BUTTON HOVER */

.btn:hover{

  transform:scale(1.03);

  filter:brightness(1.08);

}

/* FOOTER */

.footer{

  margin-top:18px;

  text-align:center;

  font-size:11px;

  color:#999;

}

/* POP */

@keyframes pop{

  to{
    opacity:1;
    transform:translateY(0);
  }

}

/* MOBILE */

@media(max-width:480px){

  .main-box{

    width:92%;

    padding:24px;

  }

  .logo{

    font-size:24px;

    letter-spacing:1px;

  }

  .banner{

    height:430px;

  }

}

</style>

</div>
